<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>无限滑动 - 修正版</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        img {
            pointer-events: none;
            user-select: none;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100vh;
            background-color: #171717;
            overflow: hidden;
        }
        .photos {
            position: relative;
            display: flex;
            flex-wrap: wrap;
            width: 90vw;
            height: 90vh;
            cursor: grab;
            background: rgba(255,255,255,0.05);
            overflow: hidden;
        }
        .photos:active {
            cursor: grabbing;
        }
        .photo-item {
            position: absolute;
            width: 180px;
            height: 120px;
            border-radius: 8px;
            background: #2a2a2a;
            overflow: hidden;
            will-change: transform;
        }
        .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }
        .photo-item:hover img {
            transform: scale(1.1);
        }
    </style>
</head>

<body>
    <div class="photos" id="photosContainer"></div>

    <script>
        // ── 生成模拟图片（纯色背景 + 数字） ──
        const container = document.getElementById('photosContainer');
        const totalItems = 28;
        const colors = ['#ff6b6b', '#ffd93d', '#6bcb77', '#4d96ff', '#ff6bff', '#ff9f43', '#00d2d3'];

        for (let i = 0; i < totalItems; i++) {
            const div = document.createElement('div');
            div.className = 'photo-item';
            div.dataset.index = i;
            const color = colors[i % colors.length];
            // 生成 canvas 模拟图片
            const canvas = document.createElement('canvas');
            canvas.width = 180;
            canvas.height = 120;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = color;
            ctx.fillRect(0, 0, 180, 120);
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 40px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(i + 1, 90, 60);
            div.appendChild(canvas);
            container.appendChild(div);
        }

        // ── 无限滑动逻辑 ──
        const items = [...container.querySelectorAll('.photo-item')];
        const containerWidth = container.clientWidth;
        const containerHeight = container.clientHeight;
        const itemWidth = 180;
        const itemHeight = 120;
        const gapX = 20;
        const gapY = 20;

        // 计算网格布局（每行最多放 n 列）
        const cols = Math.floor((containerWidth + gapX) / (itemWidth + gapX));
        const rows = Math.ceil(items.length / cols);
        const totalWidth = cols * (itemWidth + gapX) - gapX;
        const totalHeight = rows * (itemHeight + gapY) - gapY;
        const offsetX = (containerWidth - totalWidth) / 2;
        const offsetY = (containerHeight - totalHeight) / 2;

        // 存储每个 item 的基准位置（相对于容器左上角）
        const itemData = items.map((el, index) => {
            const row = Math.floor(index / cols);
            const col = index % cols;
            const x = offsetX + col * (itemWidth + gapX);
            const y = offsetY + row * (itemHeight + gapY);
            return { el, baseX: x, baseY: y, offsetX: 0, offsetY: 0 };
        });

        // 鼠标拖拽状态
        let isDragging = false;
        let startX = 0, startY = 0;
        let totalDragX = 0, totalDragY = 0;
        let lastMoveX = 0, lastMoveY = 0;

        // 更新位置（使用 transform）
        function updatePositions(force = false) {
            itemData.forEach((data) => {
                // 计算新位置：基准 + 累计偏移，并处理循环
                let newX = data.baseX + totalDragX;
                let newY = data.baseY + totalDragY;

                // 水平循环（向左或向右超出则循环）
                if (newX > containerWidth) {
                    newX -= (cols * (itemWidth + gapX));
                    // 同步调整基准，使总偏移不变
                    data.baseX -= (cols * (itemWidth + gapX));
                } else if (newX < -itemWidth) {
                    newX += (cols * (itemWidth + gapX));
                    data.baseX += (cols * (itemWidth + gapX));
                }

                // 垂直循环
                if (newY > containerHeight) {
                    newY -= (rows * (itemHeight + gapY));
                    data.baseY -= (rows * (itemHeight + gapY));
                } else if (newY < -itemHeight) {
                    newY += (rows * (itemHeight + gapY));
                    data.baseY += (rows * (itemHeight + gapY));
                }

                // 应用 transform
                data.el.style.transform = `translate(${newX}px, ${newY}px)`;
            });
        }

        // 初始放置
        updatePositions(true);

        // ── 事件绑定 ──
        container.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX;
            startY = e.clientY;
            lastMoveX = 0;
            lastMoveY = 0;
            container.style.cursor = 'grabbing';
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const dx = e.clientX - startX;
            const dy = e.clientY - startY;
            // 累加偏移
            totalDragX += dx - lastMoveX;
            totalDragY += dy - lastMoveY;
            lastMoveX = dx;
            lastMoveY = dy;
            updatePositions();
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
            container.style.cursor = 'grab';
        });

        // 处理窗口大小变化（简化，只重新计算布局，未完整实现）
        window.addEventListener('resize', () => {
            // 实际项目中需要重新计算 grid，这里省略，可重新初始化
            console.log('resize - please refresh');
        });
    </script>
</body>
</html>
